site_name: AI Infrastructure Video Pipeline
site_description: A HyperFrames-based pipeline for generating narrated explainer videos about AI infrastructure.
site_url: https://klojtas.github.io/claude-hyper-frames-test/
repo_url: https://github.com/klojtas/claude-hyper-frames-test
repo_name: klojtas/claude-hyper-frames-test
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Prerequisites: getting-started/prerequisites.md
    - Quick Start: getting-started/quickstart.md
  - Guide:
    - Architecture: guide/architecture.md
    - Configuring Scenes: guide/scenes.md
    - Images & Assets: guide/assets.md
    - Building the Composition: guide/build.md
    - Rendering to Video: guide/rendering.md
  - Reference:
    - Environment Variables: reference/env.md
    - Timing Constants: reference/timing.md
    - build.py API: reference/build-api.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/klojtas/claude-hyper-frames-test
